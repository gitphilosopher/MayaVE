name: Sync Changelog Issues

on:
  push:
    paths:
      - docs/CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync changelog issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          changelog="docs/CHANGELOG.md"

          [[ -f "$changelog" ]] || {
            echo "$changelog not found."
            exit 1
          }

          unreleased="$(
            awk '
              /^## \[Unreleased\]/ { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog"
          )"

          [[ -n "$unreleased" ]] || {
            echo "No [Unreleased] section found."
            exit 0
          }

          # Prints "<number> <STATE>" for the issue with this exact title
          # (an OPEN one is preferred if duplicates exist), or nothing.
          find_issue() {
            gh issue list --repo "$GH_REPO" --state all --limit 1000 \
              --json number,title,state |
              jq -r --arg t "$1" '
                [.[] | select(.title == $t)]
                | sort_by(.state != "OPEN")
                | first // empty
                | "\(.number) \(.state)"'
          }

          # Creates an issue and prints its number.
          create_issue() {
            local url body
            body="$(printf '%s\n\n%s' "$2" '<!-- Automatically created from docs/CHANGELOG.md -->')"
            url="$(gh issue create --repo "$GH_REPO" --title "$1" --body "$body")"
            echo "${url##*/}"
          }

          category=""

          while IFS= read -r line; do

            if [[ "$line" =~ ^###\ (Features|Improvements|Architecture|Fixes|Issues)$ ]]; then
              category="${BASH_REMATCH[1]}"
              continue
            fi

            # Only Issues and Fixes drive GitHub Issues.
            [[ "$category" == "Issues" || "$category" == "Fixes" ]] || continue

            if [[ "$line" =~ ^-\ \*\*(.+)\*\*\ —\ (.+)$ ]]; then
              title="${BASH_REMATCH[1]}"
              description="${BASH_REMATCH[2]}"
              issue_title="[Changelog] $title"

              found="$(find_issue "$issue_title")"
              read -r number state <<< "$found"

              case "$category:${state:-}" in
                Issues:)
                  number="$(create_issue "$issue_title" "$description")"
                  echo "Created open #$number: $issue_title"
                  ;;
                Issues:CLOSED)
                  gh issue reopen "$number" --repo "$GH_REPO"
                  echo "Reopened #$number: $issue_title"
                  ;;
                Fixes:)
                  number="$(create_issue "$issue_title" "$description")"
                  gh issue close "$number" --repo "$GH_REPO"
                  echo "Created and closed #$number: $issue_title"
                  ;;
                Fixes:OPEN)
                  gh issue close "$number" --repo "$GH_REPO"
                  echo "Closed #$number: $issue_title"
                  ;;
                *)
                  echo "Already ${state}: #$number $issue_title"
                  ;;
              esac
            fi

          done <<< "$unreleased"