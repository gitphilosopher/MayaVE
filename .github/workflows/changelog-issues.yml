name: Sync Changelog Issues

on:
  push:
    paths:
      - docs/CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync unreleased changelog entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          changelog="docs/CHANGELOG.md"

          [[ -f "$changelog" ]] || {
            echo "$changelog not found."
            exit 1
          }

          unreleased="$(
            awk '
              /^## \[Unreleased\]/ { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog"
          )"

          [[ -n "$unreleased" ]] || {
            echo "No [Unreleased] section found."
            exit 0
          }

          category=""

          while IFS= read -r line; do

            if [[ "$line" =~ ^###\ (Features|Improvements|Architecture|Fixes|Issues)$ ]]; then
              category="${BASH_REMATCH[1]}"
              continue
            fi

            [[ -n "$category" ]] || continue

            if [[ "$line" =~ ^-\ \*\*(.+)\*\*\ —\ (.+)$ ]]; then
              title="${BASH_REMATCH[1]}"
              description="${BASH_REMATCH[2]}"
              issue_title="[Changelog][$category] $title"

              echo "Checking: $issue_title"

              exists="$(
                if gh issue list \
                    --repo "$GH_REPO" \
                    --state all \
                    --limit 1000 \
                    --json title \
                    --jq '.[].title' |
                    grep -Fxq "$issue_title"; then
                  echo true
                else
                  echo false
                fi
              )"

              if [[ "$exists" == "true" ]]; then
                echo "Already exists."
                continue
              fi

              body="## Changelog entry

          **Category:** $category

          $description

          <!-- Automatically created from docs/CHANGELOG.md -->"

              gh issue create \
                --repo "$GH_REPO" \
                --title "$issue_title" \
                --body "$body"

              echo "Created: $issue_title"
            fi

          done <<< "$unreleased"