<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maya — Expression Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; height: 100vh; font-family: sans-serif; background: #1a1a1a; color: #eee; }
        #viewport { flex: 1; position: relative; }
        canvas { display: block; }
        #panel {
            width: 340px; padding: 16px; overflow-y: auto;
            background: #222; border-left: 1px solid #333;
        }
        #panel h2 { font-size: 14px; margin-bottom: 12px; color: #9cf; }
        #panel label { display: block; font-size: 12px; margin: 10px 0 4px; color: #bbb; }
        #panel select, #panel button {
            width: 100%; padding: 6px; background: #333; color: #eee;
            border: 1px solid #444; border-radius: 4px; font-size: 12px;
        }
        #panel button { margin-top: 6px; cursor: pointer; }
        #panel button:hover { background: #3a3a3a; }
        #sliders { margin-top: 14px; border-top: 1px solid #333; padding-top: 10px; }
        .slider-row { margin-bottom: 8px; }
        .slider-row .row-head {
            display: flex; justify-content: space-between; font-size: 11px; color: #9c9;
        }
        .slider-row input[type="range"] { width: 100%; }
        #status { margin-top: 12px; font-size: 11px; color: #888; white-space: pre-wrap; }
        #fileRow { display: flex; gap: 6px; margin-top: 4px; }
        #fileRow button { flex: 1; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="panel">
        <h2>Expression Lab — calibration tool</h2>

        <label>Emotion</label>
        <select id="emotion">
            <option value="happy">happy</option>
            <option value="excited">excited</option>
            <option value="surprised">surprised</option>
            <option value="angry">angry</option>
            <option value="sad">sad</option>
            <option value="scared">scared</option>
            <option value="relaxed">relaxed</option>
            <option value="neutral" selected>neutral</option>
        </select>

        <label>Attitude</label>
        <select id="attitude">
            <option value="sincere" selected>sincere</option>
            <option value="playful">playful</option>
            <option value="teasing">teasing</option>
            <option value="mock">mock</option>
            <option value="default">default</option>
            <option value="confused">confused</option>
            <option value="embarrassed">embarrassed</option>
            <option value="gloating">gloating</option>
            <option value="grinning">grinning</option>
            <option value="love">love</option>
            <option value="puzzled">puzzled</option>
            <option value="shocked">shocked</option>
            <option value="sneaky">sneaky</option>
            <option value="soft">soft</option>
            <option value="upset">upset</option>
        </select>

        <label>Intensity</label>
        <select id="intensity">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
            <option value="extreme">extreme</option>
        </select>

        <div id="fileRow">
            <button id="importLib">Import expressions.json</button>
            <button id="exportLib">Export expressions.json</button>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display:none" />
        <p style="font-size:10px;color:#777;margin-top:4px">
            Edits auto-save to this browser's local storage per combination.
            Export writes every saved combination to a downloadable
            expressions.json — place it at frontend/assets/expressions.json.
        </p>

        <div id="sliders"></div>

        <div id="status"></div>
    </div>

    <script type="module" src="/js/expression-lab.js"></script>
</body>
</html>
